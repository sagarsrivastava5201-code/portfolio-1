<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sagar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: #111827;
            border: 1px solid #273449;
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #error {
            color: #f87171;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>
        <p>Login to access your messages.</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="error"></div>

    </div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if (data.success) {

            window.location.href = "/admin.html";

        } else {

            document.getElementById("error").style.display = "block";
            document.getElementById("error").textContent =
                data.message || "Invalid login";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
            "Server connection failed";

    }

});

</script>

</body>
</html>
