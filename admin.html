<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Admin</title>

   <link rel="stylesheet" href="css/style.css">
   <style>
.messages-section {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

#messagesContainer {
    display: grid;
    gap: 20px;
}

.message-card {
    padding: 25px;
    border-radius: 18px;
    background: #111827;
    border: 1px solid #2d3748;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.message-card h2 {
    margin: 0;
    font-size: 22px;
}

.message-card p {
    margin: 12px 0;
    line-height: 1.6;
}

.message-card small {
    display: block;
    margin-top: 15px;
    color: #9ca3af;
}

.message-card button {
    border: none;
    cursor: pointer;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    margin-right: 8px;
}

@media (max-width: 600px) {
    .messages-section {
        width: 94%;
    }

    .message-card {
        padding: 18px;
    }.logout-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    background: #dc2626;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.logout-btn:hover {
    background: #b91c1c;
}
}

/* =========================
   MOBILE ADMIN PANEL FIX
========================= */

@media (max-width: 600px) {

    body {
        overflow-x: hidden;
    }

    .navbar {
        width: 100%;
        min-height: 70px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 24px;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 0;
    }

    .nav-links li {
        list-style: none;
    }

    .nav-links a {
        font-size: 13px;
        white-space: nowrap;
    }

    .logout-btn {
        padding: 8px 12px;
        font-size: 13px;
        white-space: nowrap;
    }

    .page-header {
        padding: 55px 20px 30px;
        text-align: center;
    }

    .page-header p {
        font-size: 11px;
        letter-spacing: 2px;
    }

    .page-header h1 {
        font-size: 30px;
    }

    .messages-section {
        width: calc(100% - 24px);
        max-width: none;
        margin: 20px auto 40px;
    }

    #messagesContainer {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .message-card {
        width: 100%;
        padding: 18px;
        border-radius: 14px;
        overflow-wrap: anywhere;
    }

    .message-card h2 {
        font-size: 18px;
    }

    .message-card p {
        font-size: 14px;
        line-height: 1.5;
    }

    .message-card small {
        font-size: 11px;
    }

    .message-card button {
        width: 100%;
        margin: 7px 0 0;
        padding: 11px 14px;
        font-size: 13px;
    }
}
/* ===== MESSAGE BUTTON FIX ===== */

.message-card button {
    border: 0 !important;
    cursor: pointer;
    padding: 11px 18px !important;
    border-radius: 10px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    color: #fff !important;
    margin-top: 10px !important;
    margin-right: 8px !important;
}

/* Mark as Read */
.message-card button.contact-btn {
    background: #2563eb !important;
    color: #fff !important;
}

.message-card button.contact-btn:hover {
    background: #1d4ed8 !important;
    transform: translateY(-2px);
}

/* Delete Message */
.message-card button[onclick^="deleteMessage"] {
    background: #dc2626 !important;
    color: #fff !important;
}

.message-card button[onclick^="deleteMessage"]:hover {
    background: #b91c1c !important;
    transform: translateY(-2px);
}

/* Mobile */
@media (max-width: 600px) {

    .message-card button {
        width: 100%;
        margin-right: 0 !important;
    }
}

/* =========================
   LOGOUT BUTTON
========================= */

.logout-btn {
    border: 1px solid rgba(239, 68, 68, 0.35);
    outline: none;

    padding: 10px 18px;
    border-radius: 10px;

    background: rgba(220, 38, 38, 0.10);
    color: #f87171;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.3s ease;
}

.logout-btn:hover {
    background: #dc2626;
    color: #ffffff;

    border-color: #dc2626;

    transform: translateY(-2px);

    box-shadow: 0 8px 22px rgba(220, 38, 38, 0.25);
}

.logout-btn:active {
    transform: scale(0.96);
}


/* Mobile */

@media (max-width: 600px) {

    .logout-btn {
        padding: 8px 13px;
        font-size: 13px;
    }
}
</style>

</head>

<body>

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Sagar<span>.</span>
            </a>

            <ul class="nav-links">
                  <li>
        <a href="index.html">Back to Website</a>
    </li>

    <li>
        <button onclick="logoutAdmin()" class="logout-btn">
            Logout
        </button>
    </li>
            </ul>

        </nav>

    </header>


    <main>

        <section class="page-header">

            <p>ADMIN PANEL</p>

            <h1>Messages</h1>

        </section>


        <section class="messages-section">

            <div id="messagesContainer">

                <p>Loading messages...</p>

            </div>

        </section>

    </main>


    <script>

async function loadMessages() {

    try {

        const response =
            await fetch("http://localhost:5000/api/messages");

        const messages = await response.json();

        const container =
            document.getElementById("messagesContainer");

        if (messages.length === 0) {

            container.innerHTML =
                "<p>No messages yet.</p>";

            return;
        }

        container.innerHTML = messages.map(message => `

            <div class="message-card">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    flex-wrap:wrap;
                ">

                    <h2>${message.name}</h2>

                    <span style="
                        padding:6px 12px;
                        border-radius:20px;
                        font-size:13px;
                        background:${message.isRead ? "#444" : "#00c853"};
                        color:white;
                    ">
                        ${message.isRead ? "READ" : "NEW"}
                    </span>

                </div>

                <p>
                    <strong>Email:</strong>
                    ${message.email}
                </p>

                <p>
                    <strong>Message:</strong>
                    ${message.message}
                </p>

                <small>
                    ${new Date(message.createdAt).toLocaleString()}
                </small>

                ${
                    !message.isRead
                    ? `
                        <button
                            onclick="markAsRead('${message._id}')"
                            class="contact-btn"
                            style="margin-top:15px;"
                        >
                            Mark as Read
                        </button>
                    `
                    : ""
                }
                    <button
    onclick="deleteMessage('${message._id}')"
    class="contact-btn"
    style="margin-top:10px; background:#dc2626;"
>
    Delete Message
</button>


                
            </div>
            

        `).join("");

    } catch (error) {

        console.error(error);

        document.getElementById("messagesContainer").innerHTML =
            "<p>Unable to load messages.</p>";

    }

}


async function markAsRead(id) {

    try {

        await fetch(
            `http://localhost:5000/api/messages/${id}/read`,
            {
                method: "PUT"
            }
        );

        loadMessages();

    } catch (error) {

        console.error(error);

    }

}


loadMessages();

async function deleteMessage(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this message?");

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:5000/api/messages/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (data.success) {
            loadMessages();
        }

    } catch (error) {

        console.error("Delete error:", error);

    }

}
async function logoutAdmin() {

    try {

        const response = await fetch("/api/logout", {
            method: "POST",
            credentials: "include"
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "/index.html";
        }

    } catch (error) {

        console.error("Logout error:", error);

    }

}


</script>

</body>

</html>
